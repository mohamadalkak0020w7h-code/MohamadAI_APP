name: Build MohamadAi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor app
        run: |
          mkdir -p capacitor-app
          cd capacitor-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MohamadAi com.mohamadai.app --web-dir=www
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://eclectic-unicorn-b734cd.netlify.app"><title>MohamadAi</title></head><body><script>location.replace("https://eclectic-unicorn-b734cd.netlify.app");</script></body></html>\n' > www/index.html
          npx cap add android

      - name: Configure live URL
        run: |
          cd capacitor-app
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mohamadai.app",
            "appName": "MohamadAi",
            "webDir": "www",
            "server": {
              "url": "https://eclectic-unicorn-b734cd.netlify.app",
              "cleartext": true
            }
          }
          EOF
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd capacitor-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MohamadAi-Android-APK
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk

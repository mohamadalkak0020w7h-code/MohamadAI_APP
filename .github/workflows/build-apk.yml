name: Build MohamadAi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor WebView wrapper for MohamadAi
        run: |
          mkdir -p capacitor-app
          cd capacitor-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MohamadAi" "com.mohamadai.app" --web-dir="www"
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0;url=https://eclectic-unicorn-b734cd.netlify.app" />
            <title>MohamadAi</title>
          </head>
          <body>
            <script>window.location.replace("https://eclectic-unicorn-b734cd.netlify.app");</script>
          </body>
          </html>
          EOF
          npx cap add android

      - name: Configure app name and live server URL
        run: |
          cd capacitor-app
          node -e '
          const fs = require("fs");
          const cfg = {
            appId: "com.mohamadai.app",
            appName: "MohamadAi",
            webDir: "www",
            server: {
              url: "https://eclectic-unicorn-b734cd.netlify.app",
              cleartext: true
            }
          };
          fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          sed -i 's/allowBackup="true"/allowBackup="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Download MohamadAi icon into Android mipmap folders
        run: |
          cd capacitor-app
          curl -fsSL "https://eclectic-unicorn-b734cd.netlify.app/icon-192.png" -o
